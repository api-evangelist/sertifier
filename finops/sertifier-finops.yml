principles:
- name: Visibility
  description: Track unique recipients per year against the plan allowance, and credentials issued per campaign, to see where credentialing spend concentrates.
- name: Allocation
  description: Map campaigns and recipient lists to programs, teams, or clients so subscription cost attributes to the right cost center.
- name: Optimization
  description: Right-size the plan to actual recipient volume, use annual billing (two months free) and non-profit/startup discounts where eligible, and consolidate credentials per recipient (which are free) rather than adding recipients.
- name: Accountability
  description: Assign an owner for the Sertifier subscription; review annual recipient consumption before renewal to avoid over-provisioning or overage upgrades.
