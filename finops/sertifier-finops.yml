description: >-
  FinOps view of Sertifier spend. Sertifier is a subscription SaaS billed
  primarily on the number of unique recipients per year, with unlimited
  credentials per recipient. Cost is driven by the plan tier (Free, Basic, Pro,
  Enterprise) and its annual recipient allowance rather than by per-API-call
  metering - the REST Credential API is a feature of paid plans, not a separately
  metered service. Optional add-ons (Advanced Support) and discounts (annual
  billing, non-profit, startup) adjust the effective rate. Enterprise agreements
  cover high-volume issuers with negotiated recipient pricing.
notes: >-
  Per-tier prices and recipient allowances are not reconciled here and differ
  across Sertifier's own pages and third-party listings; verify on the Sertifier
  pricing page. The dominant cost lever is recipient count against the plan
  allowance, so optimization means mapping unique recipients to programs and
  avoiding paying for headroom you do not use.
