meters:
- name: annual_recipients
  description: Unique credential recipients per year - the primary billable unit against a plan's allowance.
  unit: recipients
  aggregation: sum
  dimensions:
  - account
  - plan
- name: credentials_issued
  description: Credentials issued (unlimited per recipient); tracked for program reporting, not separately billed.
  unit: credentials
  aggregation: sum
  dimensions:
  - account
  - campaign
- name: plan_subscription
  description: Recurring subscription fee for the selected plan tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: support_addon
