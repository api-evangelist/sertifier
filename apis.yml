aid: sertifier
url: https://raw.githubusercontent.com/api-evangelist/sertifier/refs/heads/main/apis.yml
name: Sertifier
kind: company
description: Sertifier is a digital credential and certificate/badge management platform
  that lets organizations design, issue, verify, and analyze verifiable digital
  credentials (Open Badge-style certificates and badges) at scale. Beyond the web
  application, Sertifier exposes a REST Credential API (base https://b2b.sertifier.com,
  authenticated with a private secretKey header and an api-version header) so backend
  systems and LMS/CRM integrations can programmatically manage designs, credential
  details, email templates, campaigns, recipients, custom attributes, and issue and
  publish credentials the instant a learner completes a course. Sertifier has issued
  more than 10 million credentials across 70+ countries.
