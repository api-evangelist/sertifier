  name: Sertifier Campaigns API
  tags:
  - Campaigns
  - Issuance
  - Credentials
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://sertifier.docs.apiary.io/
