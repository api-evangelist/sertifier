aid: sertifier
name: Sertifier
review:
  question: Does Sertifier expose a documented public WebSocket API?
  answer: false
  date: '2026-07-05'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Sertifier's public developer surface is a
    request/response REST Credential API over HTTPS (base
    https://b2b.sertifier.com). There is no documented server-push transport -
    no WebSocket and no Server-Sent Events - on Sertifier's own API to model.
    Event-driven integration is described in the opposite direction: Sertifier
    consumes inbound completion events from LMS/CRM systems and no-code tools
    (Zapier, n8n) to trigger issuance, rather than pushing events out over a
    streaming socket.
findings:
  summary: |
    Sertifier does not publish a documented public WebSocket API. Sertifier is a
    digital credential and certificate/badge management platform. Its developer
    surface is a REST Credential API served at https://b2b.sertifier.com,
    authenticated with a private API key in the `secretKey` header plus an
    `api-version` header (current documented value 3.3), with a shared response
    envelope ({ message, hasError, validationErrors, data, content }) and UTC
    dates. The API models credential issuance as a Campaign (binding a Design, a
    Detail, and an Email Template) into which recipients and credentials are
    added (POST /campaign/addCredentials) and then published or scheduled. All
    documented endpoints are request/response REST over HTTPS. No realtime,
    bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented anywhere in Sertifier's Apiary reference, help center, or
    integration guides as of the review date.
  developerAccess: |
    The API key is issued from the Sertifier web application under Settings >
    API & Integrations (also referenced as Advanced > Integrations). API access
    ships with paid plans; issuance volume is bounded by the plan's annual
    recipient allowance rather than by a published per-request rate limit.
    Sertifier's guidance stresses protecting the secretKey and using an
    idempotency key (enrolment ID + campaignId) so a duplicate completion event
    does not double-issue.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://b2b.sertifier.com
      documented: true
      note: Credential API. Auth via secretKey header + api-version header. All request/response.
    - protocol: Webhook (inbound)
      scheme: https
      documented: true
      note: Sertifier receives completion events from LMS/CRM and no-code tools (Zapier, n8n) to trigger issuance. Inbound to Sertifier, not an outbound streaming socket.
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events stream is documented on Sertifier's own API.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Sertifier's Credential API reference, help center, or integration guides as of the review date.
