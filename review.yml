  endpointsModeledNote: |
    The /webhook operation in the OpenAPI (tag Webhooks, API
    sertifier:sertifier-webhooks-api) is MODELED, not confirmed. Sertifier
    documents inbound completion-event automation and no-code integrations
    rather than a first-party outbound webhook-subscription REST resource. The
    modeled endpoint is an honest placeholder to be verified against Sertifier
    support before any real use.
sources:
  - url: https://sertifier.docs.apiary.io/
    type: APIReference
    note: Public Apiary reference enumerating Design, Detail, EmailTemplate, Campaign, Credential, Recipient, Attribute resources and the /Test auth check. All REST; no WebSocket.
  - url: https://help.sertifier.com/sertifier-api-quickstart
    type: Documentation
    note: Quickstart for automating certificate creation via POST /campaign and POST /campaign/addCredentials; permanent credential URL in the response.
  - url: https://help.sertifier.com/api-key-integrations
    type: Documentation
    note: How to obtain the API key (Settings > API & Integrations); lists LMS/CRM and no-code integrations.
  - url: https://help.sertifier.com/how-to-connect-sertifier-with-whatsapp
    type: Documentation
    note: Integration guide exposing the base host https://b2b.sertifier.com, the secretKey and api-version 3.3 headers, and the addCredentials body fields.
  - url: https://docs.sertifier.com/
    type: Documentation
    note: Sertifier API documentation landing page (JS-rendered).
  - url: https://sertifier.com/pricing
    type: Pricing
    note: Subscription plans priced on annual recipients; API access on paid plans. No published rate limits.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists, and Sertifier's own public API is
    request/response REST (the Credential API at https://b2b.sertifier.com).
    No AsyncAPI document was created because there is no server-push transport
    (WebSocket or SSE) on Sertifier's own API to model; event-driven behavior is
    inbound (LMS/CRM and no-code tools calling Sertifier to trigger issuance).
